[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aruak"
version = "0.1.0"
description = "Ferramenta de consulta ao banco de dados Aruak"
authors = [{ name="Cinthia Ishida" }]
readme = "README.md"
requires-python = ">=3.8"

[tool.setuptools]
packages = ["aruak"]

[tool.setuptools.package-data]
aruak = ["_data/*.db"]

